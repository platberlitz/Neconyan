plugins { id 'com.android.application' version '8.13.0' }

def appPackage = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def numbers = appPackage.version.tokenize('.').collect { it as int }
def nodeRoot = System.getenv('NODE_MOBILE_ROOT') ?: file('../libnode').absolutePath

android {
    namespace 'io.github.platberlitz.neconyan'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'io.github.platberlitz.neconyan'
        minSdk 30
        targetSdk 36
        versionCode numbers[0] * 10000 + numbers[1] * 100 + numbers[2]
        versionName appPackage.version
        externalNativeBuild { cmake { arguments "-DNODE_MOBILE_ROOT=${nodeRoot}", '-DANDROID_STL=c++_shared' } }
        buildConfigField 'String', 'SERVER_SHA256', '"' + file('src/main/assets/server.sha256').text.trim() + '"'
    }
    signingConfigs {
        official {
            storeFile file(System.getenv('NECONYAN_KEYSTORE') ?: '../missing-release-key.jks')
            storePassword System.getenv('NECONYAN_STORE_PASSWORD')
            keyAlias 'neconyan'
            keyPassword System.getenv('NECONYAN_STORE_PASSWORD')
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { signingConfig signingConfigs.official; minifyEnabled false }
    }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
