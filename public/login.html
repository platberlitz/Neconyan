<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, interactive-widget=resizes-visual">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#161716">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sign in · Neconyan</title>
    <link rel="icon" href="img/neconyan.png" type="image/png">
    <link rel="apple-touch-icon" href="img/neconyan-icon-180.png">
    <link rel="manifest" crossorigin="use-credentials" href="manifest.json">
    <link rel="stylesheet" href="webfonts/FredokaOne/stylesheet.css?v=20260913g">
    <link rel="stylesheet" href="css/login.css?v=20260913g">
</head>
<body class="login">
    <main id="shadow_popup">
        <div id="dialogue_popup">
            <header id="logoBlock">
                <img src="img/neconyan-pixel-cat-rest.webp" alt="A resting calico cat" class="logo" width="144" height="128">
                <h1>Neconyan</h1>
                <p>Sign in to your workspace.</p>
            </header>
            <section id="userSelectBlock" aria-label="Sign in">
                <h2 id="normalLoginPrompt">Choose your account</h2>
                <h2 id="discreetLoginPrompt" style="display:none">Sign in</h2>
                <div id="userListBlock">
                    <ul id="userList"></ul>
                    <div id="handleEntryBlock" style="display:none">
                        <label for="userHandle">Account</label>
                        <input id="userHandle" type="text" autocomplete="username">
                    </div>
                    <div id="passwordEntryBlock" style="display:none">
                        <label for="userPassword">Password</label>
                        <input id="userPassword" type="password" autocomplete="current-password">
                        <button id="loginButton" type="button">Sign in</button>
                        <button id="recoverPassword" type="button" class="text-button">Forgot password?</button>
                    </div>
                    <div id="passwordRecoveryBlock" style="display:none">
                        <p id="recoverMessage">Find the recovery code in your server console.</p>
                        <label for="recoveryCode">Recovery code</label>
                        <input id="recoveryCode" type="text" autocomplete="one-time-code">
                        <label for="newPassword">New password</label>
                        <input id="newPassword" type="password" autocomplete="new-password">
                        <div class="recovery-actions">
                            <button id="sendRecovery" type="button">Reset password</button>
                            <button id="cancelRecovery" type="button" class="text-button">Cancel</button>
                        </div>
                    </div>
                </div>
                <p id="errorMessage" role="alert"></p>
                <noscript>Enable JavaScript to sign in to Neconyan.</noscript>
            </section>
        </div>
    </main>
    <script src="lib/jquery-3.5.1.min.js"></script>
    <script src="scripts/login.js" type="module"></script>
</body>
</html>
