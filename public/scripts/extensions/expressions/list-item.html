{{#each images}}
<div class="expression_list_item" data-expression="{{../expression}}" data-expression-type="{{this.type}}" data-filename="{{this.fileName}}">
    <button type="button" class="expression_list_image_container" title="{{this.pickLabel}}" aria-label="{{this.pickLabel}}">
        {{#if this.isMissing}}
        <div class="expression_list_placeholder" aria-hidden="true">
            <i class="fa-regular fa-image"></i>
            <span data-i18n="No image yet">No image yet</span>
        </div>
        {{else}}
        <img class="expression_list_image" src="{{this.imageSrc}}" alt="" loading="lazy" decoding="async" />
        {{/if}}
        {{#if this.isExtra}}
        <span class="expression_list_badge" data-i18n="Extra">Extra</span>
        {{/if}}
    </button>
    <div class="expression_list_footer">
        <div class="expression_list_title">
            <span class="expression_list_name">{{../expression}}</span>
            {{#if ../isCustom}}<small class="expression_list_custom" data-i18n="custom">custom</small>{{/if}}
        </div>
        <div class="expression_list_buttons">
            <button type="button" class="menu_button expression_list_upload" title="{{this.uploadLabel}}" aria-label="{{this.uploadLabel}}">
                <i class="fa-solid fa-upload" aria-hidden="true"></i>
            </button>
            {{#if this.canRegenerate}}
            <button type="button" class="menu_button expression_list_regenerate" title="{{this.regenerateLabel}}" aria-label="{{this.regenerateLabel}}">
                <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
            </button>
            {{/if}}
            {{#if this.canGenerate}}
            <button type="button" class="menu_button expression_list_generate" title="{{this.generateLabel}}" aria-label="{{this.generateLabel}}">
                <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
            </button>
            {{/if}}
            {{#unless this.isMissing}}
            <button type="button" class="menu_button expression_list_delete" title="{{this.deleteLabel}}" aria-label="{{this.deleteLabel}}">
                <i class="fa-solid fa-trash" aria-hidden="true"></i>
            </button>
            {{/unless}}
        </div>
    </div>
</div>
{{/each}}
