<div class="{{prefix}}prompt_manager_footer">
    {{#if promptsHtml}}
    <div class="prompt_manager_footer_removed">
        <label class="prompt_manager_footer_label" for="{{prefix}}prompt_manager_footer_append_prompt" data-i18n="Removed prompts">Removed prompts</label>
        <div class="prompt_manager_footer_row">
            <select id="{{prefix}}prompt_manager_footer_append_prompt" class="text_pole" name="append-prompt">{{{promptsHtml}}}</select>
            <button type="button" id="{{prefix}}prompt_manager_footer_add_back" class="menu_button" title="Put this prompt back in the list" data-i18n="[title]Put this prompt back in the list">
                <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
                <span data-i18n="Add back">Add back</span>
            </button>
            <button type="button" id="{{prefix}}prompt_manager_footer_delete" class="menu_button" title="Delete prompt" data-i18n="[title]Delete prompt">
                <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                <span data-i18n="Delete">Delete</span>
            </button>
        </div>
    </div>
    {{/if}}
    <div class="prompt_manager_footer_tools" role="group" aria-label="Prompt list tools" data-i18n="[aria-label]Prompt list tools">
        <button type="button" id="prompt-manager-import" class="menu_button" title="Import a prompt list" data-i18n="[title]Import a prompt list">
            <i class="fa-solid fa-file-import" aria-hidden="true"></i>
            <span data-i18n="Import list">Import list</span>
        </button>
        <button type="button" id="prompt-manager-export" class="menu_button" title="Export this prompt list" data-i18n="[title]Export this prompt list">
            <i class="fa-solid fa-file-export" aria-hidden="true"></i>
            <span data-i18n="Export list">Export list</span>
        </button>
        <button type="button" id="prompt-manager-reset-character" class="menu_button" title="Reset current character" data-i18n="[title]Reset current character">
            <i class="fa-solid fa-list-ol" aria-hidden="true"></i>
            <span data-i18n="Reset order">Reset order</span>
        </button>
    </div>
</div>
