name: ⚔️ Check Merge Conflicts

on:
  # So that PRs touching the same files as the push are updated
  push:
  # So that the `dirtyLabel` is removed if conflicts are resolved
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-merge-conflicts-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check-merge-conflicts:
    name: ⚔️ Check Merge Conflicts
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/miso
          persist-credentials: false

      - name: Read current merge conflict label
        id: labels
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const rules = require(`${process.env.GITHUB_WORKSPACE}/.github/miso/label-automation.cjs`);
            const available = await rules.repoLabelNames(github, context.repo);
            const name = rules.labelName('merge-conflict', available);
            if (!name) throw new Error('Missing merge conflict label. Run the repository label sync first.');
            core.setOutput('name', name);

      - name: Check GitHub App Configuration
        id: app-config
        env:
          ST_BOT_APP_ID: ${{ vars.ST_BOT_APP_ID }}
          ST_BOT_PRIVATE_KEY: ${{ secrets.ST_BOT_PRIVATE_KEY }}
        run: |
          if [ -n "$ST_BOT_APP_ID" ] && [ -n "$ST_BOT_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint App Token
        if: steps.app-config.outputs.enabled == 'true'
        id: app
        # Create a GitHub App token
        # https://github.com/marketplace/actions/create-github-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.ST_BOT_APP_ID }}
          private-key: ${{ secrets.ST_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Use Built-in GitHub Token
        if: steps.app-config.outputs.enabled != 'true'
        run: echo "GitHub App credentials are not configured. Falling back to github.token."

      - name: Check Merge Conflicts
        # Label Conflicting Pull Requests
        # https://github.com/marketplace/actions/label-conflicting-pull-requests
        uses: eps1lon/actions-label-merge-conflict@1df065ebe6e3310545d4f4c4e862e43bdca146f0 # v3.0.3
        with:
          dirtyLabel: ${{ steps.labels.outputs.name }}
          repoToken: ${{ steps.app.outputs.token || github.token }}
          commentOnDirty: >
            ⚠️ This PR has conflicts that need to be resolved before it can be merged.
