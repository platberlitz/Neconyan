name: Release E2E Validation

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'JSON array of group numbers, e.g. [7,8]; leave both inputs blank for all 20 groups'
        type: string
      files:
        description: 'JSON array of exact browser test files, e.g. ["tests/panel-look.e2e.js"]; omit shards'
        type: string

permissions:
  contents: read

concurrency:
  group: release-e2e-${{ github.ref }}-${{ (inputs.shards || inputs.files) && format('focused-{0}', github.run_id) || 'full' }}
  cancel-in-progress: true

env:
  CI: 'true'
  PLAYWRIGHT_HTML_OPEN: never
  NECONYAN_TEST_BASE_URL: http://127.0.0.1:4433
  NECONYAN_CONVERSATION_TEST_DISPOSABLE: '1'
  NECONYAN_DEVICE_SYNC_DISPOSABLE: '1'
  NECONYAN_RELEASE_TEST_DISPOSABLE: '1'

jobs:
  prepare:
    name: Check browsers and plan release tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      # Match the Playwright version in tests/package-lock.json. Browsers and
      # OS libraries are already installed; no apt mirror or browser CDN in CI.
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:83192064c7510f7ee73dd63dc5f22a5e01a92c81a2e6a9c715d9e3fe55471fd9
      options: --ipc=host
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install test dependencies
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
        run: npm ci --ignore-scripts --prefix tests

      - name: Check all three browsers launch
        working-directory: tests
        # Firefox checks that the launching user owns HOME. The Actions
        # container's /github/home mount is owned by a different user.
        env:
          HOME: /root
        run: |
          node --input-type=module <<'JS'
          import { chromium, firefox, webkit } from '@playwright/test';
          for (const browserType of [chromium, firefox, webkit]) {
              const browser = await browserType.launch();
              console.log(`${browserType.name()} ${browser.version()}`);
              await browser.close();
          }
          JS

      - name: Plan requested test jobs
        id: plan
        shell: bash
        env:
          RELEASE_E2E_SHARDS: ${{ inputs.shards }}
          RELEASE_E2E_FILES: ${{ inputs.files }}
        run: |
          (cd tests && npx --no-install playwright test --list --reporter=json) > "$RUNNER_TEMP/e2e-list.json"
          node scripts/release-e2e-groups.js prepare --list "$RUNNER_TEMP/e2e-list.json" --out "$RUNNER_TEMP/e2e-plan"

      - name: Upload test lists
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-e2e-plan
          path: ${{ runner.temp }}/e2e-plan/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  run-release-e2e:
    name: Browser tests (${{ matrix.id }})
    needs: prepare
    # Groups other than 1 run ubuntu-24.04: the ubuntu-latest alias now resolves
    # to Ubuntu 26.04, which Playwright 1.60 does not support. Group 1 always
    # contains crash-diagnostics.e2e.js (pinned in scripts/release-e2e-groups.js),
    # including the real renderer crash. Playwright 1.60 skips crash events on
    # Ubuntu 24.04 because Chromium never delivers them there, so that group
    # stays on 22.04.
    # https://github.com/microsoft/playwright/blob/v1.60.0/tests/library/page-event-crash.spec.ts
    runs-on: ${{ matrix.jammy && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    container:
      image: ${{ matrix.jammy && 'mcr.microsoft.com/playwright:v1.60.0-jammy@sha256:9b80f22fa7c2a899e3722c890807484710cb68870830d156268d7fb60bbdeeef' || 'mcr.microsoft.com/playwright:v1.60.0-noble@sha256:83192064c7510f7ee73dd63dc5f22a5e01a92c81a2e6a9c715d9e3fe55471fd9' }}
      options: --ipc=host
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RELEASE_E2E_JOB: ${{ matrix.id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # A commit pushed mid-run would otherwise make the server show its
      # update toast over whatever a test is measuring.
      - name: Detach checkout from its upstream
        run: git branch --unset-upstream 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Setup Bun
        shell: bash
        env:
          BUN_VERSION: '1.4.3'
          BUN_ARCHIVE_SHA512: 440ae09e98de5e3686ce3a7987b46cf3d714609bad3bc232a91de2b44f0e05a07312df0a366da3a7f628cf1047ab8785a2fc2b40baf2792c1301c9a24fecdca0
        # The Playwright images have tar but not unzip, which setup-bun needs.
        run: |
          bun_dir="$RUNNER_TEMP/neconyan-bun"
          mkdir -p "$bun_dir"
          archive=$(npm pack "@oven/bun-linux-x64@$BUN_VERSION" --ignore-scripts --silent --pack-destination "$bun_dir")
          printf '%s  %s\n' "$BUN_ARCHIVE_SHA512" "$bun_dir/$archive" | sha512sum --check
          tar -xzf "$bun_dir/$archive" -C "$bun_dir" --strip-components=2 package/bin/bun
          test "$("$bun_dir/bun" --version)" = "$BUN_VERSION"
          echo "$bun_dir" >> "$GITHUB_PATH"

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install test dependencies
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
        run: npm ci --ignore-scripts --prefix tests

      - name: Download test lists
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-e2e-plan
          path: ${{ runner.temp }}/e2e-plan/

      - name: Initialize server state
        run: |
          mkdir -p /tmp/opencode
          npm run init

      - name: Run release E2E suite
        shell: bash
        env:
          HOME: /root
          NECONYAN_LAUNCHER: '1'
          NECONYAN_SKIP_BROWSER_AUTO_LAUNCH: '1'
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          server_log="$RUNNER_TEMP/neconyan-server.log"
          bun server.js --browserLaunchEnabled=false > "$server_log" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          startup_deadline=$((SECONDS + 120))
          until curl --fail --silent --connect-timeout 1 --max-time 2 "$NECONYAN_TEST_BASE_URL/" > /dev/null; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Neconyan exited before becoming ready.' >&2
              cat "$server_log" >&2
              exit 1
            fi

            if (( SECONDS >= startup_deadline )); then
              echo 'Neconyan did not become ready within 120 seconds.' >&2
              cat "$server_log" >&2
              exit 1
            fi

            sleep 1
          done

          node tests/prepare-release-fixture.js
          npm run test:e2e --prefix tests -- --workers=1 --test-list="$RUNNER_TEMP/e2e-plan/$RELEASE_E2E_JOB.txt" --reporter=line,html

      - name: Print server log on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/neconyan-server.log" ]; then
            cat "$RUNNER_TEMP/neconyan-server.log"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-e2e-diagnostics-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/neconyan-server.log
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore
          retention-days: 14
