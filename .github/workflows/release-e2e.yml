name: Release E2E Validation

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      shards:
        description: 'JSON array of group numbers, e.g. [7,8]; leave both inputs blank for all 20 groups'
        type: string
      files:
        description: 'JSON array of exact browser test files, e.g. ["tests/panel-look.e2e.js"]; omit shards'
        type: string
      nightly_preview:
        description: 'Preview nightly reporting on this ref without changing issues or saved timings'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-e2e-${{ github.event_name == 'schedule' && 'nightly-staging' || format('{0}-{1}', github.ref, (inputs.shards || inputs.files || inputs.nightly_preview) && format('focused-{0}', github.run_id) || 'full') }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CI: 'true'
  PLAYWRIGHT_HTML_OPEN: never
  NECONYAN_TEST_BASE_URL: http://127.0.0.1:4433
  NECONYAN_CONVERSATION_TEST_DISPOSABLE: '1'
  NECONYAN_DEVICE_SYNC_DISPOSABLE: '1'
  NECONYAN_RELEASE_TEST_DISPOSABLE: '1'

jobs:
  select:
    name: Select the commit to test
    # A scheduled rerun could otherwise resolve a different staging commit.
    # Incomplete runs leave the commit eligible for the next night instead.
    if: github.event_name != 'schedule' || (github.run_attempt == 1 && github.repository == 'platberlitz/Neconyan')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.select.outputs.commit }}
      run: ${{ steps.select.outputs.run }}
    steps:
      - name: Resolve the commit and previous nightly run
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_PREVIEW: ${{ inputs.nightly_preview }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nightly-input"
          commit="$GITHUB_SHA"
          run=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            commit=$(gh api "repos/$GH_REPO/git/ref/heads/staging" --jq .object.sha)
          fi
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$NIGHTLY_PREVIEW" == true ]]; then
            runs=$(gh api "repos/$GH_REPO/actions/workflows/release-e2e.yml/runs?event=schedule&status=completed&per_page=20" --jq '.workflow_runs[].id')
            for earlier in $runs; do
              found=$(gh api "repos/$GH_REPO/actions/runs/$earlier/artifacts?name=release-e2e-nightly-state" \
                --jq '[.artifacts[] | select(.expired == false)] | length')
              if [[ "$found" != 0 ]]; then
                gh run download "$earlier" --name release-e2e-nightly-state --dir "$RUNNER_TEMP/nightly-input"
                break
              fi
            done
            if [[ "$GITHUB_EVENT_NAME" == schedule && -f "$RUNNER_TEMP/nightly-input/state.json" ]]; then
              last=$(jq -r '.lastTested.commit // empty' "$RUNNER_TEMP/nightly-input/state.json")
              if [[ "$commit" == "$last" ]]; then
                run=false
                echo '### Staging is unchanged since the last complete nightly run.' >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            # Upload an input even on the first night.
            if [[ ! -f "$RUNNER_TEMP/nightly-input/state.json" ]]; then
              echo '{"version":1}' > "$RUNNER_TEMP/nightly-input/state.json"
            fi
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Selected $commit (run browser tests: $run)"
      - name: Save the nightly input for this run
        if: github.event_name == 'schedule' || inputs.nightly_preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-e2e-nightly-input
          path: ${{ runner.temp }}/nightly-input/state.json
          overwrite: true
          if-no-files-found: error
          retention-days: 2

  prepare:
    name: Check browsers and plan release tests
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      # Match the Playwright version in tests/package-lock.json. Browsers and
      # OS libraries are already installed; no apt or Playwright browser download.
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:83192064c7510f7ee73dd63dc5f22a5e01a92c81a2e6a9c715d9e3fe55471fd9
      options: --ipc=host
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.select.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install test dependencies
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
        run: npm ci --ignore-scripts --prefix tests

      - name: Check all three browsers launch
        working-directory: tests
        # Firefox checks that the launching user owns HOME. The Actions
        # container's /github/home mount is owned by a different user.
        env:
          HOME: /root
        run: |
          node --input-type=module <<'JS'
          import { chromium, firefox, webkit } from '@playwright/test';
          for (const browserType of [chromium, firefox, webkit]) {
              const browser = await browserType.launch();
              console.log(`${browserType.name()} ${browser.version()}`);
              await browser.close();
          }
          JS

      - name: Download nightly timings
        if: github.event_name == 'schedule' || inputs.nightly_preview
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-e2e-nightly-input
          path: ${{ runner.temp }}/nightly-input/

      - name: Plan requested test jobs
        id: plan
        shell: bash
        env:
          RELEASE_E2E_SHARDS: ${{ inputs.shards }}
          RELEASE_E2E_FILES: ${{ inputs.files }}
          RELEASE_E2E_NIGHTLY_STATE: ${{ runner.temp }}/nightly-input/state.json
        run: |
          (cd tests && npx --no-install playwright test --list --reporter=json) > "$RUNNER_TEMP/e2e-list.json"
          node scripts/release-e2e-groups.js prepare --list "$RUNNER_TEMP/e2e-list.json" --out "$RUNNER_TEMP/e2e-plan"

      - name: Upload test lists
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-e2e-plan
          path: ${{ runner.temp }}/e2e-plan/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  run-release-e2e:
    name: Browser tests (${{ matrix.id }})
    needs: [select, prepare]
    # Groups other than 1 run ubuntu-24.04: the ubuntu-latest alias now resolves
    # to Ubuntu 26.04, which Playwright 1.60 does not support. Group 1 always
    # contains crash-diagnostics.e2e.js (pinned in scripts/release-e2e-groups.js),
    # including the real renderer crash. Playwright 1.60 skips crash events on
    # Ubuntu 24.04 because Chromium never delivers them there, so that group
    # stays on 22.04.
    # https://github.com/microsoft/playwright/blob/v1.60.0/tests/library/page-event-crash.spec.ts
    runs-on: ${{ matrix.jammy && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    container:
      image: ${{ matrix.jammy && 'mcr.microsoft.com/playwright:v1.60.0-jammy@sha256:9b80f22fa7c2a899e3722c890807484710cb68870830d156268d7fb60bbdeeef' || 'mcr.microsoft.com/playwright:v1.60.0-noble@sha256:83192064c7510f7ee73dd63dc5f22a5e01a92c81a2e6a9c715d9e3fe55471fd9' }}
      options: --ipc=host
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RELEASE_E2E_JOB: ${{ matrix.id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # An exact SHA leaves no tracked upstream that can trigger an update
          # toast over the controls under test when a new commit is pushed.
          ref: ${{ needs.select.outputs.commit }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Setup Bun
        shell: bash
        env:
          BUN_VERSION: '1.4.3'
          BUN_ARCHIVE_SHA512: 440ae09e98de5e3686ce3a7987b46cf3d714609bad3bc232a91de2b44f0e05a07312df0a366da3a7f628cf1047ab8785a2fc2b40baf2792c1301c9a24fecdca0
        # The Playwright images have tar but not unzip, which setup-bun needs.
        run: |
          bun_dir="$RUNNER_TEMP/neconyan-bun"
          mkdir -p "$bun_dir"
          archive=$(npm pack "@oven/bun-linux-x64@$BUN_VERSION" --ignore-scripts --silent --pack-destination "$bun_dir")
          printf '%s  %s\n' "$BUN_ARCHIVE_SHA512" "$bun_dir/$archive" | sha512sum --check
          tar -xzf "$bun_dir/$archive" -C "$bun_dir" --strip-components=2 package/bin/bun
          test "$("$bun_dir/bun" --version)" = "$BUN_VERSION"
          echo "$bun_dir" >> "$GITHUB_PATH"

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install test dependencies
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
        run: npm ci --ignore-scripts --prefix tests

      - name: Download test lists
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-e2e-plan
          path: ${{ runner.temp }}/e2e-plan/

      - name: Set up Microsoft Edge for language profile tests
        if: matrix.edge
        timeout-minutes: 5
        shell: bash
        working-directory: tests
        env:
          HOME: /root
          EDGE_VERSION: 155.0.4283.62-1
          EDGE_DEB_SHA256: 3e53834d9d6e505bc57e6bff44d92cfe8cf0bed9064e88efc5b0d8f1c75f70fa
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/microsoft-edge-stable.deb"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 180 \
            "https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_${EDGE_VERSION}_amd64.deb" \
            --output "$package"
          printf '%s  %s\n' "$EDGE_DEB_SHA256" "$package" | sha256sum --check
          # Headless Edge needs the browser files, not the package's apt/post-install hooks.
          dpkg-deb --fsys-tarfile "$package" | tar -x -C / ./opt/microsoft/msedge
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ channel: 'msedge' });
          console.log(`Microsoft Edge ${browser.version()}`);
          await browser.close();
          JS

      - name: Initialize server state
        run: |
          mkdir -p /tmp/opencode
          npm run init

      - name: Run release E2E suite
        id: e2e
        shell: bash
        env:
          HOME: /root
          NECONYAN_LAUNCHER: '1'
          NECONYAN_SKIP_BROWSER_AUTO_LAUNCH: '1'
          RELEASE_E2E_REPORT: ${{ runner.temp }}/result.json
          RELEASE_E2E_COMMIT: ${{ needs.select.outputs.commit }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          server_log="$RUNNER_TEMP/neconyan-server.log"
          bun server.js --browserLaunchEnabled=false > "$server_log" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          startup_deadline=$((SECONDS + 120))
          until curl --fail --silent --connect-timeout 1 --max-time 2 "$NECONYAN_TEST_BASE_URL/" > /dev/null; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Neconyan exited before becoming ready.' >&2
              cat "$server_log" >&2
              exit 1
            fi

            if (( SECONDS >= startup_deadline )); then
              echo 'Neconyan did not become ready within 120 seconds.' >&2
              cat "$server_log" >&2
              exit 1
            fi

            sleep 1
          done

          node tests/prepare-release-fixture.js
          npm run test:e2e --prefix tests -- --workers=1 --test-list="$RUNNER_TEMP/e2e-plan/$RELEASE_E2E_JOB.txt" \
            --reporter=line,html,./release-e2e-reporter.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const { tests } = JSON.parse(fs.readFileSync(process.env.RELEASE_E2E_REPORT, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `flaky=${tests.some(test => test.outcome === 'flaky')}\n`);
          // Playwright can exit successfully if a failed test skips its retry.
          if (tests.some(test => test.outcome === 'unexpected')) process.exitCode = 1;
          JS

      - name: Upload browser results
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-e2e-result-${{ matrix.id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Print server log on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/neconyan-server.log" ]; then
            cat "$RUNNER_TEMP/neconyan-server.log"
          fi

      - name: Upload failed-attempt diagnostics
        if: ${{ failure() || steps.e2e.outputs.flaky == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-e2e-diagnostics-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/neconyan-server.log
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore
          retention-days: 14

  summary:
    name: Summarise browser results
    needs: [select, prepare, run-release-e2e]
    if: ${{ !cancelled() && needs.select.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: ${{ (github.event_name == 'schedule' || inputs.nightly_preview) && '0' || '1' }}
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
      - name: Download result artifacts
        if: needs.prepare.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-e2e-result-*
          path: ${{ runner.temp }}/e2e-results/
      - name: Write browser summary
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MATRIX_RESULT: ${{ needs.run-release-e2e.result }}
          RELEASE_E2E_MATRIX: ${{ needs.prepare.outputs.matrix }}
          RELEASE_E2E_COMMIT: ${{ needs.select.outputs.commit }}
        run: node scripts/release-e2e-summary.js "$RUNNER_TEMP/e2e-results"
      - name: Download the previous nightly state
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.nightly_preview) }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-e2e-nightly-input
          path: ${{ runner.temp }}/nightly-input/
      - name: Prepare the tracking issue and timings
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.nightly_preview) }}
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MATRIX_RESULT: ${{ needs.run-release-e2e.result }}
          RELEASE_E2E_MATRIX: ${{ needs.prepare.outputs.matrix }}
          RELEASE_E2E_COMMIT: ${{ needs.select.outputs.commit }}
        run: node scripts/release-e2e-nightly.js "$RUNNER_TEMP/e2e-results" "$RUNNER_TEMP/nightly-input/state.json" . "$RUNNER_TEMP/nightly-output"
      - name: Save the nightly report
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.nightly_preview) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-e2e-nightly-report
          path: ${{ runner.temp }}/nightly-output/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  publish-nightly:
    name: Update the staging tracker and save nightly timings
    needs: [select, summary]
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.run_attempt == 1 && needs.select.result == 'success' && github.repository == 'platberlitz/Neconyan' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.select.outputs.run == 'true' && 'release-e2e-nightly-report' || 'release-e2e-nightly-input' }}
          path: ${{ runner.temp }}/nightly/
      - name: Publish the nightly issues
        if: needs.select.outputs.run == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          NIGHTLY_REPORT: ${{ runner.temp }}/nightly/issues.json
        with:
          script: |
            const { publish, tracking, recurring } = JSON.parse(require('node:fs').readFileSync(process.env.NIGHTLY_REPORT, 'utf8'));
            if (!publish) return;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', creator: 'github-actions[bot]', per_page: 100,
            });
            const marker = key => `<!-- neconyan-nightly:${key} -->`;
            const find = key => issues.find(issue => !issue.pull_request && issue.user?.login === 'github-actions[bot]'
              && issue.body?.startsWith(`${marker(key)}\n`));
            const title = 'Nightly staging browser checks';
            const tracker = find('tracker');
            const body = `${marker('tracker')}\n${tracking.body}`;
            if (tracker) {
              await github.rest.issues.update({ ...context.repo, issue_number: tracker.number, body,
                ...(tracking.green || tracker.state === 'open' ? {} : { state: 'open' }) });
            } else if (!tracking.green) {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
            for (const item of recurring) {
              if (find(item.key)) continue;
              await github.rest.issues.create({ ...context.repo, title: item.title, body: `${marker(item.key)}\n${item.body}` });
            }
      - name: Keep the nightly state for the next run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-e2e-nightly-state
          path: ${{ runner.temp }}/nightly/state.json
          if-no-files-found: error
          retention-days: 30
