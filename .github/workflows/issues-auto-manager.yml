name: 🛠️ Issues Manager

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  manage-issue:
    name: 🏷️ Label Issue or Post Label Comment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('node:fs');
            const rules = require(`${process.env.GITHUB_WORKSPACE}/.github/miso/label-automation.cjs`);
            const available = await rules.repoLabelNames(github, context.repo);
            if (context.payload.action === 'opened') {
              const issue = context.payload.issue;
              const labels = rules.issuePlatformLabels(issue.body ?? '', available);
              if (labels.length) await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels });
            } else {
              const config = fs.readFileSync('.github/issues-auto-comments.yml', 'utf8');
              fs.writeFileSync('.github/issues-auto-comments.yml', rules.renderCommentConfig(config, available));
            }
      - if: github.event.action == 'labeled'
        uses: peaceiris/actions-label-commenter@f0dbbef043eb1b150b566db36b0bdc8b7f505579 # v1.10.0
        with:
          config_file: .github/issues-auto-comments.yml
          github_token: ${{ github.token }}
