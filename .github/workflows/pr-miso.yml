name: 🐯 Miso Merge Check

on:
  workflow_dispatch: # Allow to manually call this workflow
  # Push runs come from the pushed branch, so every staging merge sweeps pull
  # requests whose own branch predates the bot.
  push:
    branches: [staging]
  # Pull request runs use the pull request head, so they work before this file
  # reaches main. Forks are skipped below because their token is read-only.
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: read

# Each pull request gets its own queue, so a newer event on the same pull request
# replaces its stale wait, but activity on one pull request never cancels the
# check on another. Staging pushes and manual runs share one queue of their own.
concurrency:
  group: miso-merge-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  miso:
    # Fork pull requests get a read-only token and could not comment anyway
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Keep in sync with OWN_CHECK_NAMES in .github/miso/merge-bot.cjs
    name: 🐯 Miso merge check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Miso
        # Bot files come from the branch the pull request targets, never from
        # pull request code. Push and manual runs use the ref that started them.
        # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          sparse-checkout: .github/miso
          persist-credentials: false

      - name: Check Open Pull Requests
        # GitHub Script
        # https://github.com/marketplace/actions/github-script
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const miso = require(`${process.env.GITHUB_WORKSPACE}/.github/miso/merge-bot.cjs`);
            // Pull request runs wait for their own checks here because GitHub
            // only wakes workflow_run on the default branch, which this bot does
            // not reach until a release. Staging sweeps never wait. The bot comes
            // from the base branch, which can predate optionsForEvent.
            const options = miso.optionsForEvent?.(context) ?? { settleChecks: true };
            const results = await miso.run({ github, context, core, ...options });
            core.summary.addHeading('Miso merge check').addTable([
              [{ data: 'Pull request', header: true }, { data: 'State', header: true }],
              ...Object.entries(results).map(([number, state]) => [`#${number}`, state]),
            ]);
            await core.summary.write();
