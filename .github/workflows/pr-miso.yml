name: 🐯 Miso Merge Check

on:
  workflow_dispatch: # Allow to manually call this workflow
  # PR events and workflow_run only reach this workflow once it is on the
  # default branch, so every staging push sweeps the open pull requests instead.
  # Remove this once the bot has been released to main.
  push:
    branches: [staging]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  # Re-check once the workflows that report on pull requests have finished
  workflow_run:
    workflows:
      - ✅ Pull Request Checks
      - 🧾 PR Metadata
      - 🔀 Pull Request Manager
      - ⚔️ Check Merge Conflicts
      - Release E2E Validation
      - README Mirror
    types: [completed]

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: read

# Every run checks all open pull requests, so one queued run is enough
concurrency:
  group: miso-merge-check
  cancel-in-progress: false

jobs:
  miso:
    # Keep in sync with OWN_CHECK_NAMES in .github/miso/merge-bot.cjs
    name: 🐯 Miso merge check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Miso
        # Bot files come from the branch the pull request targets, never from
        # pull request code. Push and manual runs use the ref that started them.
        # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          sparse-checkout: .github/miso
          persist-credentials: false

      - name: Check Open Pull Requests
        # GitHub Script
        # https://github.com/marketplace/actions/github-script
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          # workflow_run already fires when a check finishes, every other event
          # waits here instead because GitHub ignores it on non-default branches
          MISO_SETTLE_CHECKS: ${{ github.event_name == 'workflow_run' && 'false' || 'true' }}
        with:
          script: |
            const miso = require(`${process.env.GITHUB_WORKSPACE}/.github/miso/merge-bot.cjs`);
            const results = await miso.run({ github, context, core, settleChecks: process.env.MISO_SETTLE_CHECKS === 'true' });
            core.summary.addHeading('Miso merge check').addTable([
              [{ data: 'Pull request', header: true }, { data: 'State', header: true }],
              ...Object.entries(results).map(([number, state]) => [`#${number}`, state]),
            ]);
            await core.summary.write();
