name: iOS Release Build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false
env:
  XCODE_VERSION: '16.4'
  XCODEGEN_VERSION: '2.48.0'
  XCODEGEN_SHA256: 620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Turn off Spotlight indexing
        # Indexing keeps running through the simulator tests and competes with
        # the simulator for the runner's three cores.
        run: |
          sudo mdutil -a -i off > /dev/null || echo "::warning::Spotlight indexing could not be turned off"
          mdutil -s /
      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if ! test -d "$app"; then
            echo "Xcode $XCODE_VERSION is not on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
      - name: Check runtime installation and path aliases
        run: |
          swiftc ios/App/RuntimeInstaller.swift ios/tools/storage-tests/main.swift -o "$RUNNER_TEMP/neconyan-storage-tests"
          "$RUNNER_TEMP/neconyan-storage-tests"
      - name: Check retained startup diagnostics
        run: |
          swiftc ios/App/StartupDiagnostics.swift ios/tools/diagnostics-tests/main.swift -o "$RUNNER_TEMP/neconyan-diagnostics-tests"
          "$RUNNER_TEMP/neconyan-diagnostics-tests"
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the iOS launcher scripts
        run: |
          node --check ios/server-bootstrap.mjs
          node --check android/bootstrap-config.mjs
          node --test tests/ios-bootstrap.node.js tests/android-bootstrap-config.node.js tests/android-startup-note.node.js
      - name: Import and verify a real 13 GiB ZIP payload
        env:
          NECONYAN_LARGE_IMPORT_BYTES: '13958643712'
        run: |
          # macOS exposes its temporary directory through /var, a symbolic link.
          # The storage fixtures require the same canonical paths as the app.
          export TMPDIR="$(node -p 'require("node:fs").realpathSync(require("node:os").tmpdir())')"
          node --max-old-space-size=512 --test tests/application-import-large.node.js > ios/large-import-test.log 2>&1 || { cat ios/large-import-test.log; exit 1; }
          cat ios/large-import-test.log
      - name: Prepare the standalone server payload
        run: |
          node scripts/build-ios-payload.js
          node --test ios/tools/*.test.mjs
      - name: Prepare the pinned iOS runtime
        env:
          NECONYAN_GITHUB_TOKEN: ${{ github.token }}
        run: bash ios/prepare-runtime.sh
      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          cd ios
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate
      - name: Build real-device app without distribution signing
        run: |
          xcodebuild -project ios/Neconyan.xcodeproj -scheme Neconyan -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios/build/device CODE_SIGNING_ALLOWED=NO build > ios/device-build.log 2>&1 || { tail -100 ios/device-build.log; exit 1; }
          mkdir -p ios/artifacts/Payload
          cp -R ios/build/device/Build/Products/Release-iphoneos/Neconyan.app ios/artifacts/Payload/
          test -f ios/artifacts/Payload/Neconyan.app/server/server-bootstrap.mjs
          test -f ios/artifacts/Payload/Neconyan.app/server/dist/frontend/asset-manifest.json
          test -f ios/artifacts/Payload/Neconyan.app/payload-version.txt
          cd ios/artifacts
          # Without these flags ditto can add AppleDouble files and quarantine
          # attributes that sideloading tools reject.
          ditto -c -k --norsrc --noextattr --noqtn --keepParent Payload Neconyan-unsigned.ipa
          rm -rf Payload
          shasum -a 256 Neconyan-unsigned.ipa > SHA256SUMS
          cp ../generated/server/release-provenance.json provenance.json
      - name: Verify the packaged device IPA
        run: python3 scripts/verify-ios-build.py --commit "$GITHUB_SHA" ios/artifacts/Neconyan-unsigned.ipa
      - name: Name the release files
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          mkdir -p release
          cp ios/artifacts/Neconyan-unsigned.ipa "release/Neconyan-$version-ios-unsigned.ipa"
          cp ios/artifacts/provenance.json release/provenance-ios.json
          cd release
          shasum -a 256 *.ipa provenance-ios.json > SHA256SUMS-ios
      - name: Start an iPhone and an iPad simulator
        id: simulator
        run: |
          set -euo pipefail
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          family = sys.argv[1]
          devices = json.load(sys.stdin)["devices"]
          def runtime(key):
              match = re.search(r"iOS-(\d+)-(\d+)", key)
              return tuple(int(part) for part in match.groups()) if match else (-1, -1)
          for key in sorted(devices, key=runtime, reverse=True):
              if runtime(key) < (17, 0):
                  continue
              names = [x for x in devices[key] if x["name"].startswith(family)]
              if names:
                  print(names[0]["udid"])
                  print(names[0]["name"] + " / " + key, file=sys.stderr)
                  break
          ' "$1"
          }
          phone=$(pick iPhone)
          tablet=$(pick iPad)
          test -n "$phone"
          test -n "$tablet"
          xcrun simctl boot "$phone"
          xcrun simctl bootstatus "$phone" -b
          echo "id=$phone" >> "$GITHUB_OUTPUT"
          echo "ipad=$tablet" >> "$GITHUB_OUTPUT"
      - name: Test standalone startup and relaunch on iOS
        run: |
          node ios/tools/model-fixture.mjs > ios/model-fixture.log 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          xcodebuild -project ios/Neconyan.xcodeproj -scheme Neconyan -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -parallel-testing-enabled NO -derivedDataPath ios/build/simulator -resultBundlePath ios/test-results.xcresult CODE_SIGNING_ALLOWED=NO test > ios/simulator-test.log 2>&1 || {
            grep -E 'error:|^Test Case .* (passed|failed)' ios/simulator-test.log || true
            tail -40 ios/simulator-test.log
            exit 1
          }
      - name: Test startup and page features on an iPad
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: |
          xcrun simctl shutdown '${{ steps.simulator.outputs.id }}' || true
          xcrun simctl boot '${{ steps.simulator.outputs.ipad }}'
          xcrun simctl bootstatus '${{ steps.simulator.outputs.ipad }}' -b
          node ios/tools/model-fixture.mjs > ios/model-fixture-ipad.log 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          xcodebuild -project ios/Neconyan.xcodeproj -scheme Neconyan -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.ipad }}' -parallel-testing-enabled NO -derivedDataPath ios/build/simulator -resultBundlePath ios/test-results-ipad.xcresult CODE_SIGNING_ALLOWED=NO -only-testing:NeconyanUITests/StandaloneTests/testBundledServerLoadsAndRelaunches -only-testing:NeconyanUITests/StandaloneTests/testPageFeaturesWorkInsideTheApp test > ios/ipad-test.log 2>&1 || {
            grep -E 'error:|^Test Case .* (passed|failed)' ios/ipad-test.log || true
            tail -40 ios/ipad-test.log
            exit 1
          }
      - name: Upload release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Collect simulator server diagnostics
        if: always()
        run: |
          for device in '${{ steps.simulator.outputs.id }}' '${{ steps.simulator.outputs.ipad }}'; do
            test -n "$device" || continue
            container=$(xcrun simctl get_app_container "$device" io.github.platberlitz.neconyan data 2>/dev/null || true)
            if test -n "$container"; then
              mkdir -p "ios/device-$device"
              cp "$container/Library/Application Support/Neconyan/server.log" "ios/device-$device/server.log" || true
              cp "$container/Library/Application Support/Neconyan/"startup-diagnostics*.jsonl "ios/device-$device/" || true
              xcrun simctl io "$device" screenshot "ios/device-$device/simulator.png" || true
            fi
          done
          xcrun xcresulttool export attachments --path ios/test-results.xcresult --output-path ios/test-attachments || true
          xcrun xcresulttool export attachments --path ios/test-results-ipad.xcresult --output-path ios/test-attachments-ipad || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-build-diagnostics-${{ github.sha }}
          path: |
            ios/artifacts/
            ios/*-build.log
            ios/*-test.log
            ios/device-*/
            ios/model-fixture*.log
            ios/test-results*.xcresult
            ios/test-attachments*/
