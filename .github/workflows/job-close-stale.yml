name: 🕒 Close Stale Issues/PRs Workflow

on:
  # Run the workflow every day
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  resolve-labels:
    name: Read current stale label names
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      stale: ${{ steps.labels.outputs.stale }}
      inactive: ${{ steps.labels.outputs.inactive }}
      keep-open: ${{ steps.labels.outputs.keep-open }}
      awaiting-reply: ${{ steps.labels.outputs.awaiting-reply }}
      no-response: ${{ steps.labels.outputs.no-response }}
      alternative-exists: ${{ steps.labels.outputs.alternative-exists }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/miso
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        id: labels
        with:
          script: |
            const { labelName, repoLabelNames } = require(`${process.env.GITHUB_WORKSPACE}/.github/miso/label-automation.cjs`);
            const available = await repoLabelNames(github, context.repo);
            for (const id of ['stale', 'inactive', 'keep-open', 'awaiting-reply', 'no-response', 'alternative-exists']) {
              const name = labelName(id, available);
              if (!name) throw new Error(`Missing label ${id}. Run the repository label sync first.`);
              core.setOutput(id, name);
            }

  mark-inactivity:
    name: ⏳ Mark Issues/PRs without Activity
    runs-on: ubuntu-latest
    needs: [resolve-labels]

    steps:
      - name: Check GitHub App Configuration
        id: app-config
        env:
          ST_BOT_APP_ID: ${{ vars.ST_BOT_APP_ID }}
          ST_BOT_PRIVATE_KEY: ${{ secrets.ST_BOT_PRIVATE_KEY }}
        run: |
          if [ -n "$ST_BOT_APP_ID" ] && [ -n "$ST_BOT_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint App Token
        if: steps.app-config.outputs.enabled == 'true'
        id: app
        # Create a GitHub App token
        # https://github.com/marketplace/actions/create-github-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.ST_BOT_APP_ID }}
          private-key: ${{ secrets.ST_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Mark Issues/PRs without Activity
        # Close Stale Issues and PRs
        # https://github.com/marketplace/actions/close-stale-issues
        uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          repo-token: ${{ steps.app.outputs.token || github.token }}
          days-before-stale: 183
          days-before-close: 7
          operations-per-run: 30
          remove-stale-when-updated: true
          enable-statistics: true
          stale-issue-message: >
            ⏳ This issue has been inactive for 6 months. If it's still relevant, drop a comment below to keep it open.
            Otherwise, it will be auto-closed in 7 days.
          stale-pr-message: >
            ⏳ This PR has been inactive for 6 months. If it's still relevant, update it or remove the stale label.
            Otherwise, it will be auto-closed in 7 days.
          close-issue-message: >
            🔒 This issue was auto-closed due to inactivity for over 6 months.
          close-pr-message: >
            🔒 This PR was auto-closed due to inactivity for over 6 months.
          stale-issue-label: ${{ needs.resolve-labels.outputs.stale }}
          close-issue-label: ${{ needs.resolve-labels.outputs.inactive }}
          stale-pr-label: ${{ needs.resolve-labels.outputs.stale }}
          close-pr-label: ${{ needs.resolve-labels.outputs.inactive }}
          exempt-issue-labels: ${{ needs.resolve-labels.outputs.keep-open }}
          exempt-pr-labels: ${{ needs.resolve-labels.outputs.keep-open }}

  await-user-response:
    name: ⚠️ Mark Issues/PRs Awaiting User Response
    needs: [resolve-labels, mark-inactivity]
    runs-on: ubuntu-latest
    if: always() && needs.resolve-labels.result == 'success'

    steps:
      - name: Check GitHub App Configuration
        id: app-config
        env:
          ST_BOT_APP_ID: ${{ vars.ST_BOT_APP_ID }}
          ST_BOT_PRIVATE_KEY: ${{ secrets.ST_BOT_PRIVATE_KEY }}
        run: |
          if [ -n "$ST_BOT_APP_ID" ] && [ -n "$ST_BOT_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint App Token
        if: steps.app-config.outputs.enabled == 'true'
        id: app
        # Create a GitHub App token
        # https://github.com/marketplace/actions/create-github-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.ST_BOT_APP_ID }}
          private-key: ${{ secrets.ST_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Mark Issues/PRs Awaiting User Response
        # Close Stale Issues and PRs
        # https://github.com/marketplace/actions/close-stale-issues
        uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          repo-token: ${{ steps.app.outputs.token || github.token }}
          days-before-stale: 7
          days-before-close: 7
          operations-per-run: 30
          remove-stale-when-updated: true
          stale-issue-message: >
            ⚠️ Hey! We need some more info to move forward with this issue.
            Please provide the requested details in the next few days to keep this ticket open.
          close-issue-message: >
            🔒 This issue was auto-closed due to no response from user.
          only-labels: ${{ needs.resolve-labels.outputs.awaiting-reply }}
          labels-to-remove-when-unstale: ${{ needs.resolve-labels.outputs.awaiting-reply }}
          stale-issue-label: ${{ needs.resolve-labels.outputs.no-response }}
          close-issue-label: ${{ needs.resolve-labels.outputs.inactive }}
          exempt-issue-labels: ${{ needs.resolve-labels.outputs.alternative-exists }}

  alternative-exists:
    name: 🔄 Mark Issues with Alternative Exists
    needs: [resolve-labels, mark-inactivity, await-user-response]
    runs-on: ubuntu-latest
    if: always() && needs.resolve-labels.result == 'success'

    steps:
      - name: Check GitHub App Configuration
        id: app-config
        env:
          ST_BOT_APP_ID: ${{ vars.ST_BOT_APP_ID }}
          ST_BOT_PRIVATE_KEY: ${{ secrets.ST_BOT_PRIVATE_KEY }}
        run: |
          if [ -n "$ST_BOT_APP_ID" ] && [ -n "$ST_BOT_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint App Token
        if: steps.app-config.outputs.enabled == 'true'
        id: app
        # Create a GitHub App token
        # https://github.com/marketplace/actions/create-github-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.ST_BOT_APP_ID }}
          private-key: ${{ secrets.ST_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Mark Issues with Alternative Exists
        # Close Stale Issues and PRs
        # https://github.com/marketplace/actions/close-stale-issues
        uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          repo-token: ${{ steps.app.outputs.token || github.token }}
          days-before-stale: 7
          days-before-close: 7
          operations-per-run: 30
          remove-stale-when-updated: true
          stale-issue-message: >
            🔄 An alternative solution has been provided for this issue.
            Did this solve your problem? If so, we'll go ahead and close it.
            If you still need help, drop a comment within the next 7 days to keep this open.
          close-issue-message: >
            ✅ Closing this issue due to no confirmation on the alternative solution.
          only-labels: ${{ needs.resolve-labels.outputs.alternative-exists }}
          stale-issue-label: ${{ needs.resolve-labels.outputs.awaiting-reply }}
          close-issue-label: ${{ needs.resolve-labels.outputs.inactive }}
          exempt-issue-labels: ${{ needs.resolve-labels.outputs.keep-open }}
