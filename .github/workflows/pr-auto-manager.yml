name: 🔀 Pull Request Manager

on:
  workflow_dispatch:
    inputs:
      preview_pr:
        description: 'PR number to classify without changing labels'
        type: number
        required: true
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-auto-manager-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  classify:
    name: 🏷️ Label PR by Title, Size and Files
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["opened", "synchronize", "reopened", "edited"]'), github.event.action)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/miso
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const rules = require(`${process.env.GITHUB_WORKSPACE}/.github/miso/label-automation.cjs`);
            const preview = context.eventName === 'workflow_dispatch';
            const pull_number = preview ? Number(context.payload.inputs.preview_pr) : context.payload.pull_request.number;
            if (!Number.isSafeInteger(pull_number) || pull_number < 1) throw new Error('Enter a valid PR number.');
            const args = { ...context.repo, pull_number };
            const { data: pr } = await github.rest.pulls.get(args);
            if (!preview && (pr.head.sha !== context.payload.pull_request.head.sha || pr.state !== 'open')) return;
            const files = await github.paginate(github.rest.pulls.listFiles, args);
            const available = await rules.repoLabelNames(github, context.repo);
            const current = new Set(pr.labels.map(label => label.name));
            const { add, remove } = rules.planPrLabels({ title: pr.title, files, current, available, totalLines: pr.additions + pr.deletions });
            console.log(JSON.stringify({ preview, add, remove }));
            if (preview) {
              const catalogue = require(`${process.env.GITHUB_WORKSPACE}/.github/miso/labels.json`);
              const finalNames = new Set(Object.values(catalogue).map(label => label.name));
              const final = rules.planPrLabels({ title: pr.title, files, current, available: finalNames, totalLines: pr.additions + pr.deletions });
              await core.summary.addHeading(`Label preview for #${pull_number}`)
                .addHeading('Current repository labels', 2).addCodeBlock(JSON.stringify({ add, remove }, null, 2), 'json')
                .addHeading('After the rename', 2).addCodeBlock(JSON.stringify(final, null, 2), 'json').write();
              return;
            }
            const issue = { ...context.repo, issue_number: pull_number };
            if (add.length) await github.rest.issues.addLabels({ ...issue, labels: add });
            for (const name of remove) {
              await github.rest.issues.removeLabel({ ...issue, name }).catch(error => { if (error.status !== 404) throw error; });
            }

  check-merge-blocking-labels:
    name: 🚫 Check Merge Blocking Labels
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the base branch's label rules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/miso
          persist-credentials: false
      - name: Check merge blockers
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { BLOCKING_LABELS } = require(`${process.env.GITHUB_WORKSPACE}/.github/miso/labels.cjs`);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
            if (!pr.labels.some(({ name }) => BLOCKING_LABELS.has(name))) return;
            await github.rest.checks.create({
              ...context.repo, name: 'PR Label Warning', head_sha: pr.head.sha, status: 'completed', conclusion: 'neutral',
              output: { title: 'Potential Merge Issue', summary: 'This PR has a merge-blocking label. Proceed with caution.' }
            });

  write-auto-comments:
    name: 💬 Post PR Comments Based on Labels
    if: github.event.action == 'labeled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('node:fs');
            const rules = require(`${process.env.GITHUB_WORKSPACE}/.github/miso/label-automation.cjs`);
            const labels = await rules.repoLabelNames(github, context.repo);
            const config = fs.readFileSync('.github/pr-auto-comments.yml', 'utf8');
            fs.writeFileSync('.github/pr-auto-comments.yml', rules.renderCommentConfig(config, labels));
      - uses: peaceiris/actions-label-commenter@f0dbbef043eb1b150b566db36b0bdc8b7f505579 # v1.10.0
        with:
          config_file: .github/pr-auto-comments.yml
          github_token: ${{ github.token }}

  update-linked-issues:
    name: 🔗 Mark Linked Issues Done on Staging Merge
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/miso
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { linkedIssueNumbers, markIssuesDone } = require(`${process.env.GITHUB_WORKSPACE}/.github/miso/label-automation.cjs`);
            const { body, number } = context.payload.pull_request;
            const query = `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 100, after: $cursor) {
                    nodes { number repository { nameWithOwner } }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }`;
            const numbers = linkedIssueNumbers(body);
            const repoName = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            let cursor = null;
            do {
              const result = await github.graphql(query, { ...context.repo, number, cursor });
              const links = result.repository.pullRequest.closingIssuesReferences;
              numbers.push(...links.nodes.filter(link => link.repository.nameWithOwner.toLowerCase() === repoName).map(link => link.number));
              cursor = links.pageInfo.hasNextPage ? links.pageInfo.endCursor : null;
            } while (cursor);
            await markIssuesDone({ github, repo: context.repo, numbers, released: false });
