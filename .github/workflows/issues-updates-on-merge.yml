name: 🔄 Update Issues on Push

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  issues: write

jobs:
  update-linked-issues:
    name: 🔗 Mark Linked Issues Done on Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          sparse-checkout: .github/miso
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { linkedIssueNumbers, markIssuesDone } = require(`${process.env.GITHUB_WORKSPACE}/.github/miso/label-automation.cjs`);
            const { before, after } = context.payload;
            if (!/^[\da-f]{40}$/.test(before) || !/^[\da-f]{40}$/.test(after)) throw new Error('Expected Git commit IDs in the push event.');
            if (/^0+$/.test(before) || /^0+$/.test(after)) return;
            const messages = execFileSync('git', ['log', '--format=%B', `${before}..${after}`, '--'], { encoding: 'utf8' });
            await markIssuesDone({ github, repo: context.repo, numbers: linkedIssueNumbers(messages), released: context.ref === 'refs/heads/main' });
