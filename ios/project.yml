name: Neconyan
options:
  bundleIdPrefix: io.github.platberlitz
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: false
    CODE_SIGNING_ALLOWED: false
    MARKETING_VERSION: '1.4.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Neconyan:
    type: application
    platform: iOS
    sources:
      - App
    resources:
      - path: generated/server
        type: folder
      - generated/payload-version.txt
    dependencies:
      - framework: vendor/NodeMobile.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.platberlitz.neconyan
        SWIFT_OBJC_BRIDGING_HEADER: App/Neconyan-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
    info:
      path: generated/Info.plist
      properties:
        CFBundleDisplayName: Neconyan
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSPhotoLibraryUsageDescription: Choose images for characters, personas and backgrounds.
        NSCameraUsageDescription: Take an image for a character or persona.
        NSMicrophoneUsageDescription: Record a voice message when you choose to use voice input.
        ITSAppUsesNonExemptEncryption: false
  NeconyanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: Neconyan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  Neconyan:
    build:
      targets:
        Neconyan: all
        NeconyanUITests: [test]
    test:
      targets: [NeconyanUITests]
